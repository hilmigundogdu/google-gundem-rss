name: Google gündem RSS

# Yalnız zamanlayıcı ve elle tetikleme. Asıl tetikleyici Mac mini'deki launchd işidir (2 saatte bir; GitHub zamanlayıcısı
# zamanlanmış işi günde birkaç kez başlatıyor); cron yedektir.
on:
  schedule:
    - cron: '15 */2 * * *'   # besleme (2 saatte bir, x-gundem-rss'le çakışmasın diye :15)
    - cron: '47 3 * * *'     # günlük canlı tutma (60 gün etkinliksizlikte zamanlanmış iş kapanmasın)
  workflow_dispatch:

concurrency:
  group: google-gundem
  cancel-in-progress: false

jobs:
  build:
    if: github.event.schedule != '47 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
      - name: Beslemeleri üret
        run: node google.mjs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
          OUT_DIR: public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Workflow'u etkin tut
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/gundem.yml/enable" && echo "Workflow etkin."
        env:
          GH_TOKEN: ${{ github.token }}
